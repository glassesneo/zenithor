
name: Build CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@main
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - name: prepare-linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libglu1-mesa-dev mesa-common-dev xorg-dev libasound-dev
      - name: run Tests
        run: |
          zig build test
      - name: build Native
        run: |
          zig build examples --summary all
      - name: build Native with gl
        run: |
          zig build examples --summary all -Dgl
      - name: build Wasm
        run: |
          zig build examples --summary all -Dtarget=wasm32-emscripten
      - name: build Wasm with wgpu
        run: |
          zig build examples --summary all -Dtarget=wasm32-emscripten -Dwgpu
