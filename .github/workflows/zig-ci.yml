
name: Zig CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v3
      - name: Install Zig
        run: |
          curl -L https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz | tar -xJ
          sudo mv zig-x86_64-linux-0.15.1 /usr/local/zig
          sudo ln -s /usr/local/zig/zig /usr/local/bin/zig
      - name: prepare-linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libglu1-mesa-dev mesa-common-dev xorg-dev libasound-dev
      - name: build Native
        run: |
          zig build examples --summary all
      - name: build Native with gl
        run: |
          zig build examples --summary all -Dgl
      - name: build Wasm
        run: |
          zig build examples --summary all -Dtarget=wasm32-emscripten
      - name: build Wasm in with wgpu
        run: |
          zig build examples --summary all -Dtarget=wasm32-emscripten -Dwgpu
